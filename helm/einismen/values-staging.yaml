replicaCount: 1

image:
  repository: harbor.k3s.k0.nu/lek/einismen-web
  tag: staging
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: staging-einismen.k3s.k0.nu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: staging-einismen-tls
      hosts:
        - staging-einismen.k3s.k0.nu

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
