replicaCount: 1

image:
  repository: harbor.k3s.k0.nu/lek/einismen-web
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: einismen.k3s.k0.nu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: einismen-tls
      hosts:
        - einismen.k3s.k0.nu

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
