replicaCount: 1

image:
  repository: harbor.k3s.k0.nu/lek/einismen-web
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: einismen.k0.nu
      paths:
        - path: /
          pathType: Prefix
    - host: einismen.k3s.k0.nu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: einismen-tls
      hosts:
        - einismen.k0.nu
        - einismen.k3s.k0.nu

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: ingress-nginx
  ingressPodSelector:
    matchLabels:
      app.kubernetes.io/component: controller

nodeSelector: {}
tolerations: []
affinity: {}
