server {
  listen 8080;
  listen [::]:8080;

  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  recursive_error_pages off;
  absolute_redirect off;
  port_in_redirect off;
  server_name_in_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Permitted-Cross-Domain-Policies none always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'; upgrade-insecure-requests" always;

  if ($request_method != GET) {
    return 405;
  }

  error_page 404 /404.html;
  error_page 405 /405.html;
  error_page 500 502 503 504 /50x.html;

  location = /en {
    return 301 /en/;
  }

  location = / {
    return 301 /sv/;
  }

  location = /404.html {
    internal;
    ssi on;
    ssi_types text/html;
  }

  location = /405.html {
    internal;
    ssi on;
    ssi_types text/html;
  }

  location = /50x.html {
    internal;
    ssi on;
    ssi_types text/html;
  }

  location / {
    ssi on;
    ssi_types text/html;
    try_files $uri $uri/ $uri.html =404;
  }

  location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
