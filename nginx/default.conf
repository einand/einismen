server {
  listen 8080;
  listen [::]:8080;

  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;
  server_name_in_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Permitted-Cross-Domain-Policies none always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;

  if ($request_method != GET) {
    return 405;
  }

  location = /en {
    return 301 /en/;
  }

  location / {
    ssi on;
    ssi_types text/html;
    try_files $uri $uri/ $uri.html =404;
  }

  location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
